description: Villoid is a Norwegian online fashion retailer (villoid.no, redirected from villoid.com)
  operating a Shopify-hosted boutique that curates over 250 designer and contemporary womenswear brands
  such as Ganni, Isabel Marant, Stella McCartney and ROTATE Birger Christensen. The store sells dresses,
  shoes, bags, accessories, sportswear and home goods, offering same-day delivery in Norway, easy returns,
  gift cards and payment via Klarna, Vipps, Visa and Mastercard. Originally surfaced as a portfolio company
  of 500 Global, Villoid exposes a consumer storefront and publishes no public developer or API surface.
